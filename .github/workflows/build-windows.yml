name: build-windows-portable

on:
  workflow_dispatch:
  push:
    branches:
      - sv-ursaluna-speedcheck

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          arch: "win64_msvc2019_64"

      - name: Configure
        shell: pwsh
        run: cmake -S SerialPrograms -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Package (windeployqt)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter SerialPrograms.exe | Select-Object -First 1
          if (-not $exe) { throw "SerialPrograms.exe not found" }

          $outDir = Join-Path $pwd "portable"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item $exe.FullName $outDir

          $windeploy = Join-Path (Join-Path $env:Qt6_DIR "bin") "windeployqt.exe"
          & $windeploy (Join-Path $outDir "SerialPrograms.exe")

      - name: Upload artifact (portable)
        uses: actions/upload-artifact@v4
        with:
          name: SerialPrograms-portable-windows
          path: portable
